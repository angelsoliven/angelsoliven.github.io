<!-- Generate HTML starter code with ! then the Enter key -->

<!DOCTYPE html>
<html lang="en">

<!-- <head> is information about the page -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tutorial </title> <!-- Generates tab name -->
</head>

<!-- <body> is what is displayed visually -->
<body>
    <div>
        <h1 id = "main-title">
            This is a heading.
        </h1>

        <p class = "body-text">
            This is a paragraph.
        </p>

        <a href = "https://csumb.edu"> <!-- ALWAYS USE https NOT http. Latter is not secure -->
            This is a link.
        </a>

        <input> <!-- <input> is a text box -->
    </div>

    <img src = "images/shiba.jpg" width = "100" alt = "A happy Shiba Inu" /> <!-- Generates an image of choice with screen reader text -->

    <!-- Generates a clickable button -->
    <button id = "home-confirm" class = "confirm small"> <!-- using a space in quotes means the item is part of two different classes --> 
        Click me
    </button>
</body>
</html>
