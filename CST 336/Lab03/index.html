<!DOCTYPE html>
<html lang="en" class="full-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lab 3 Quiz: Kingdom Hearts </title>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="css/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Handjet:wght,ELSH@100..900,2&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet">
</head>

<body class="full-page">
    <header id="title-section" class="center">
        <div id="title" class="center">
            <h1 id="title-text"> Kingdom Hearts Quiz </h1>
        </div>
    </header>

    <div id="main-section" class="center">
        <main id="quiz-form" class="center">
            <div id="q-section">
                <p class="question"> 1. Who is the main character? </p>
                <div id="q1Choices" class="center"></div>

                <p class="question"> 2. What is the level 3 healing spell? </p>
                <div class="center input-box">
                    <input id="textBox" type="text" name="q2">
                </div>

                <p class="question"> 3. Fill in the blank: There are ____ Princesses of Heart </p>
                <div class="center input-box">
                    <input id="numberBox" type="number" name="q3">
                </div>

                <p class="question"> 4. What color are Sora's shorts from Kingdom Hearts 1? </p>
                <div class="center input-box">
                    <select id="colorInput">
                        <option id="yellow" value="y"> Yellow </option>
                        <option id="red" value="r"> Red </option>
                        <option id="blue" value="b"> Blue </option>
                        <option id="orange" value="o"> Orange </option>
                    </select>
                </div>

                <p class="question"> 5. Select all possible Organization XIII members </p>
                <div id="q5Choices" class="center"></div>
            </div>
        </main>
    </div>

    <div id="result-section" class="center">
        <div class="center result-box">
            <p id="score" class="results"></p>
            <p id="congrats-msg" class="results"></p>

        </div>

        <div id="form-results" class="center">
            <div class="center button-box">
                <button id="submit-button"> Submit </button>
            </div>
        </div>

        <div class="center result-box">
            <p id="quizCount" class="results"></p>
        </div>
    </div>
</body>

</html>
