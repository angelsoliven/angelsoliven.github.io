<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/script.js" defer></script>
</head>

<body>
    <h1> Sign Up Form </h1>

    <fieldset>
        <legend>Sign Up</legend>
        First Name: <input type="text"><br>
        Last Name: <input type="text"><br>
        Email: <input type="text"><br>
        Phone Number:<input type="text"><br><br>
        Zip Code: <input id="zipCode" type="text"><br>
        <p id="city"> City: </p>
        <br>
        <p id="latitude"> Latitude: </p>
        <br>
        <p id="longitude"> Longitude: </p>
        <br><br>
        State: <select id="state"></select><br>
        Select a County: <select id="county"></select><br>

        Desired Username: <input id="username" type="text"><br>
        <p id="available"></p>
        <p id="suggested"></p>
        Password: <input id="passwordInput" type="password"><br>
        Type Password Again: <input type="password"><br>
        <input type="submit" value="Sign up!">
    </fieldset>

</body>

</html>
